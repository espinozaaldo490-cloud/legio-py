
name: Publicar tienda Legio PY

on:
  push:
    branches: [principal]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./legión-py

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar tienda
        run: npm run build -- --base=/legio-py/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir pagina compilada
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./legión-py/dist

      - name: Publicar pagina
        id: deployment
        uses: actions/deploy-pages@v4
